name: splitease
description: Production-grade Flutter expense sharing app — BLoC + Clean Architecture + Firebase.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Google Sign-In
  google_sign_in: ^6.2.1
  google_sign_in_web: ^0.12.4

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.4

  # Routing
  go_router: ^14.3.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Network
  connectivity_plus: ^6.0.5

  #Qr
  qr_flutter: ^4.1.0

  web: ^1.0.0

  
  

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.3.0

  # UI
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  dartz: ^0.10.1
  rxdart: ^0.28.0
  logger: ^2.6.2
  share_plus: ^10.0.3
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  timeago: ^3.7.0
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  injectable_generator: ^2.6.2
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
